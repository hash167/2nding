<link rel="import" href="../../bower_components/polymer/polymer.html">
<link rel="import" href="../movie-votes/movie-votes.html">

<polymer-element name="movie-card" attributes="mid mtitle poster">
    <template>
        <link rel="stylesheet" href="../../styles/movie-card.css">
        <div layout horizontal>
            <img id ="poster" src="{{poster}}" width="54" height="80" alt="{{title}}" />
            <div flex layout vertical center>
                <div id="title">{{mtitle}}</div>
                <movie-votes mid="{{mid}}"></movie-votes>
            </div>
        </div>
    </template>
    <script>
        (function () {
            Polymer('movie-card', {
                mid: null,
                mtitle: null,
                poster: null
            });
        })();
    </script>
</polymer-element>
