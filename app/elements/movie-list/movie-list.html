<link rel="import" href="../../bower_components/polymer/polymer.html">
<link rel="import" href="../../bower_components/core-ajax/core-ajax.html">
<link rel="import" href="../../bower_components/core-shared-lib/core-shared-lib.html">
<link rel="import" href="../movie-card/movie-card.html">

<polymer-element name="movie-list" attributes="">
    <template>
       <core-ajax id="ajax" auto url="{{search_url}}" on-core-response="{{moviesLoaded}}" handleAs="json"></core-ajax>
        <template repeat="{{movie in movies}}">
            <movie-card mid="{{movie.id}}" mtitle="{{movie.title}}" poster="{{movie.posters.thumbnail}}"></movie-card>
        </template>
    </template>
    <script>
        (function () {
            addEventListener('core-shared-lib-load', function() {
      console.log('client.js lib load notify');
    });
            Polymer('movie-list', {
                movies: [],
                movies_temp: [],
                search_url: "/api/movies/now_playing",
                search_query: '',

                applyFilter: function(query) {
                    var normalizedQuery = (query || '').toLowerCase();
                    this.search_query = normalizedQuery;

                    if (!normalizedQuery) {
                        this.movies = this.movies_temp.slice(0);
                        return;
                    }

                    this.movies = this.movies_temp.filter(function(movie) {
                        return (movie.title || '').toLowerCase().indexOf(normalizedQuery) !== -1;
                    });
                },
                
                moviesLoaded: function() {

                    this.movies = this.$.ajax.response.movies;
                    this.movies_temp = this.$.ajax.response.movies;
                    this.applyFilter(this.search_query);
                      
                    //this.fire('movies-loaded');

                    // temporarily, for demo purposes
                    var self = this;
                    setTimeout(function(){
                        self.fire('movies-loaded');
                    }, 2000);
                },

                ready: function() {
                    var self = this;
                    document.addEventListener('movie-search', function(e) {
                        self.applyFilter(e.detail && e.detail.query ? e.detail.query : '');
                    });
                }
            });
        })();
    </script>
</polymer-element>
